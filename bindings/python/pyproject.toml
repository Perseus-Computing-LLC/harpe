[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "harpe-native"
version = "0.1.0a11"
description = "Python extension exposing the harpe Rust kernels (exact 0/1 knapsack)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
]

[tool.maturin]
module-name = "harpe_native"
